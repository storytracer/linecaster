[project]
name = "linecaster-kraken"
version = "0.1.1"
description = "kraken engines for linecaster: kraken's PP-OCRv6 line recognizer on torch"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # the linecaster releases this package works with: its engine API (linecaster.engines.api) and data model
    "linecaster>=0.1,<0.3",
    # kraken with the PP-OCRv6 code; the script that installs it pins the source (see pipelines/transcribe_modular.py)
    "kraken>=7.1.0",
    # the PyPI 2.14 wheels are the CUDA 13 build on Linux (aarch64 and x86_64); 2.14 is kraken's upper bound
    "torch==2.14.0",
    "torchvision==0.29.0",
    "huggingface-hub>=1.0",
    "regex",
    "Pillow>=11",
]

# the engines by versioned id (docs/reference/catalog.md); their presets and models live in linecaster's catalog
[project.entry-points."linecaster.engines"]
"kraken.recognition.v1" = "linecaster_kraken:KrakenRecognitionEngine"


[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

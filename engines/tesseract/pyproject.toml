[project]
name = "linecaster-tesseract"
version = "0.1.4"
description = "Tesseract engines for linecaster: Tesseract's LSTM line recognizer through tesserocr"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # the linecaster releases this package works with: its engine API (linecaster.engines.api) and data model
    "linecaster>=0.1,<0.6",
    # the wheels bundle Tesseract 5.5.3 and Leptonica on Linux (aarch64 and x86_64); no system packages
    "tesserocr==2.12.0",
    "numpy",
    "Pillow>=11",
    "regex",
]

# the engines by versioned id (docs/reference/catalog.md); their presets and models live in linecaster's catalog
[project.entry-points."linecaster.engines"]
"tesseract.recognition.v1" = "linecaster_tesseract:TesseractRecognitionEngine"


[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

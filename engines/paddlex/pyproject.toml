[project]
name = "linecaster-paddlex"
version = "0.1.2"
description = "PaddleX engines for linecaster: PP-DocLayout layout analysis, PP-OCRv6 text-line detection and PP-OCRv6 text recognition on ONNX Runtime"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # the linecaster releases this package works with: its engine API (linecaster.engines.api) and data model
    "linecaster>=0.1,<0.4",
    # ONNX Runtime for the PaddleX models with the CUDA 13 runtime libraries it loads from the nvidia-* packages
    "onnxruntime-gpu>=1.23",
    "nvidia-cuda-runtime>=13,<14",
    "nvidia-cuda-nvrtc>=13,<14",
    "nvidia-cublas>=13,<14",
    "nvidia-cufft>=12",
    "nvidia-curand>=10.4",
    "nvidia-cudnn-cu13>=9",
    "paddlepaddle>=3.2.2,<3.3",
    "paddlex[ocr-core,ocr]>=3.7",
    "numpy",
    # PP-FormulaNet runs on PaddleX's transformers engine (Hugging Face transformers on torch)
    "transformers>=5",
    "ftfy",
    # PaddleX pins OpenCV's GUI build (libGL, which slim images lack); the source below swaps in linecaster's stub,
    # the headless build of the same version
    "opencv-contrib-python==4.10.0.84",
]

# the engines by versioned id (docs/reference/catalog.md); their presets and models live in linecaster's catalog
[project.entry-points."linecaster.engines"]
"paddlex.layout.v1" = "linecaster_paddlex:PaddleLayoutEngine"
"paddlex.lines.v1" = "linecaster_paddlex:PaddleLineEngine"
"paddlex.recognition.v1" = "linecaster_paddlex:PaddleRecognitionEngine"
"paddlex.tables.v1" = "linecaster_paddlex:PaddleTableEngine"
"paddlex.formulas.v1" = "linecaster_paddlex:PaddleFormulaEngine"

[tool.uv.sources]
opencv-contrib-python = { path = "../../stubs/opencv-contrib-python" }

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[project]
name = "linecaster-surya"
version = "0.1.2"
description = "Surya OCR engines for linecaster: Datalab's surya-ocr package (full-page OCR) attached to a vLLM server"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # the linecaster releases this package works with: its engine API (linecaster.engines.api) and data model
    "linecaster>=0.1,<0.4",
    # the release that shipped with Surya OCR 2.5; it declares pillow<11, which
    # linecaster's Pillow>=11 overrides in the pipeline scripts (NOTES.md)
    "surya-ocr==0.23.0",
    "numpy",
]

# the engines by versioned id (docs/reference/catalog.md); their presets and models live in linecaster's catalog
[project.entry-points."linecaster.engines"]
"surya.recognition.v1" = "linecaster_surya:SuryaRecognitionEngine"


[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

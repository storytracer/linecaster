[project]
name = "linecaster-indra"
version = "0.1.4"
description = "Indra OCR engines for linecaster: Datalab's CPU OCR pipeline (ONNX Runtime) on whole pages"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # the linecaster releases this package works with: its engine API (linecaster.engines.api) and data model
    "linecaster>=0.1,<0.6",
    # built against the model set v1.1.0 (the catalog's pin)
    "indra-ocr==1.1.2",
    "numpy",
    "Pillow>=11",
]

# the engines by versioned id (docs/reference/catalog.md); their presets and models live in linecaster's catalog
[project.entry-points."linecaster.engines"]
"indra.recognition.v1" = "linecaster_indra:IndraRecognitionEngine"


[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

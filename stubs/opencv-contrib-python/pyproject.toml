[project]
name = "opencv-contrib-python"
version = "4.10.0.84"
description = "Stub: satisfies PaddleX's pin on opencv-contrib-python with the headless build of the same version (same cv2 code, no GUI, no libGL), so PaddleX runs in slim images such as HF Jobs'"
requires-python = ">=3.10"
dependencies = ["opencv-contrib-python-headless==4.10.0.84"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

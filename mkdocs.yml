# The docs site, built by Zensical: uv run linecaster docs, then uv run --group docs zensical build --strict (into
# site/). The pages are docs/: the hand-written reference (docs/reference/) and what `linecaster docs` generates, not
# in git (index.md from the README, changelog.md, components/, catalog/, llms.txt).
site_name: Linecaster
site_description: Modular OCR pipelines you can run anywhere
site_url: https://storytracer.github.io/linecaster/
repo_url: https://github.com/storytracer/linecaster
repo_name: storytracer/linecaster
edit_uri: blob/main/docs/
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode

# the page grid at full width instead of the theme's 61rem
extra_css:
  - stylesheets/layout.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Get started:
      - Your first pipeline: start/first-run.md
      - A pipeline in Python: start/python.md
      - Run a vision-language model: start/vlm.md
      - Score a run: start/score.md
  - Concepts:
      - Overview: concepts/overview.md
      - Components and pipelines: concepts/pipelines.md
      - Models, engines and presets: concepts/models.md
      - Page records: concepts/page-records.md
      - Text and normalization: concepts/text.md
      - Evaluation: concepts/evaluation.md
  - Reference:
      - Components: components/README.md
      - Catalog: catalog/README.md
      - Architecture: reference/architecture.md
      - Pipelines: reference/pipelines.md
      - Data model: reference/data-model.md
      - Serialization: reference/serialization.md
      - Catalog files: reference/catalog.md
      - Evaluation: reference/evaluation.md
      - Glossary: reference/glossary.md
  - Operations:
      - Running at scale: reference/running.md
      - Fetching over HTTP: reference/http.md
      - Broker: reference/broker.md
      - Tracing: reference/tracing.md
  - Contributing:
      - Conventions: reference/conventions.md
      - Compatibility and releases: reference/compatibility.md
  - Changelog: changelog.md

# versioned docs (mike, Zensical's fork): one folder per release on the gh-pages branch, "latest" the newest
extra:
  version:
    provider: mike
    default: latest

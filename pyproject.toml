[project]
name = "linecaster"
version = "0.0.1"
description = "Modular text recognition for print and handwriting: layout, line, text, table and formula recognisers plus post-processing as datatrove pipelines"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Sebastian Majstorovic", email = "storytracer@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "docling-core>=2.95",
    # tabulate (docling's text export of tables) measures cell widths with wcwidth when it is installed and
    # with len() otherwise: combining marks (kraken writes a + U+0308) then pad tables differently
    "wcwidth>=0.2",
    # Unicode line, word and sentence breaking for the document reflow (pure Python)
    "uniseg>=0.10",
    "lxml>=5",
    "numpy>=2",
    "Pillow>=11",
    "datatrove[io]>=0.10.1,<0.11",
    "saturate==0.3.0",
    # the catalogue's documents (YAML front matter; read with YAML 1.2 booleans, linecaster.catalog.yamlio)
    "pyyaml>=6",
]

[project.optional-dependencies]
# MiniCPM-OCR 1.0: the SDK's own post-processing and Markdown assembly (pure Python; no Paddle without its [layout] extra)
minicpm-ocr = ["minicpm-ocr==1.0.1"]
# Ray clusters: datatrove's RayPipelineExecutor (linecaster.runtime.ray.RayGPUExecutor)
ray = ["ray[default]>=2.40"]
# items' manifests (IIIF, METS) and http(s):// images (linecaster.blocks.readers.manifests, linecaster.net.http):
# pybookget's manifest parser and HTTP layer
# (rate limits, retries that honour Retry-After); its core install, without its CLI
pybookget = ["pybookget>=1.1"]

[project.scripts]
linecaster = "linecaster.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# spark and forge share one uv.lock; an older uv may not read a lockfile written by a newer one
required-version = ">=0.13.6"

[tool.uv.sources]
# not on PyPI yet; GitHub's source archive at a commit (Jobs images without git can install it)
pybookget = { url = "https://github.com/storytracer/pybookget/archive/449bcc50b25aaa8d4ad4ea00bc78c9554e136af7.tar.gz" }

[tool.pytest.ini_options]
testpaths = ["tests"]

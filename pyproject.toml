[project]
name = "linecaster"
version = "0.0.1"
description = "Modular text recognition for print and handwriting: layout, line, text, table and formula recognizers plus post-processing as datatrove pipelines"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Sebastian Majstorovic", email = "storytracer@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "docling-core>=2.95",
    # tabulate (docling's text export of tables) measures cell widths with wcwidth when it is installed and
    # with len() otherwise: combining marks (kraken writes a + U+0308) then pad tables differently
    "wcwidth>=0.2",
    # Unicode line, word and sentence breaking for recomposition (pure Python)
    "uniseg>=0.10",
    # Unicode scripts (\p{Script=...}) for the rule-based steps' by-script dispatch (linecaster.engines.scripts)
    "regex>=2024.11.6",
    "lxml>=5",
    "numpy>=2",
    "Pillow>=11",
    "datatrove[io]>=0.10.1,<0.11",
    "saturate==0.3.0",
    # every YAML file (the catalog, run records): YAML 1.2, duplicate keys are errors, comments kept on write
    # (linecaster.catalog.yamlio)
    "ruamel.yaml>=0.18",
    # tracing, always on (linecaster.tracing): spans per task and per sampled or failed page, written to OUT/traces
    # as OTLP JSON lines and, when the OTEL_* variables say so, exported over OTLP/HTTP
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
]

[project.optional-dependencies]
# MiniCPM-OCR 1.0: the SDK's own post-processing and Markdown assembly (pure Python; no Paddle without its [layout] extra)
minicpm-ocr = ["minicpm-ocr==1.0.1"]
# Ray clusters: datatrove's RayPipelineExecutor (linecaster.runtime.ray.RayGPUExecutor)
ray = ["ray[default]>=2.40"]
# items' manifests (IIIF, METS) and http(s):// images (linecaster.blocks.readers.manifests, linecaster.net.http):
# pybookget's manifest parser and HTTP layer
# (rate limits, retries that honor Retry-After); its core install, without its CLI
pybookget = ["pybookget>=1.1"]
# PDF files as items, their pages rendered to images (linecaster.blocks.readers.pdf.PdfReader): PDFium's bindings
pypdfium2 = ["pypdfium2>=4.30"]

[project.scripts]
linecaster = "linecaster.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
# the docs site (mkdocs.yml): uv run --group docs mkdocs build --strict
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.6,<10"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# spark and forge share one uv.lock; an older uv may not read a lockfile written by a newer one
required-version = ">=0.13.6"

[tool.uv.sources]
# not on PyPI yet; GitHub's source archive at a commit (Jobs images without git can install it)
pybookget = { url = "https://github.com/storytracer/pybookget/archive/470b2aaed835cfa73ee471c4879f8129d3bf8705.tar.gz" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# the markers (linecaster.testing.markers): gpu and network tests are skipped where they cannot run (the conftest
# hook); CI runs -m "not gpu and not network and not parity"
addopts = ["--strict-markers"]
markers = [
    "gpu: needs a CUDA device; skipped without one",
    "network: downloads model weights or reaches the internet; skipped without the network",
    "slow: takes over about 10 s",
    "parity: compares outputs against the goldens",
]

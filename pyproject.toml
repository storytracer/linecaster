[project]
name = "linecaster"
version = "0.8.1"
description = "Modular text recognition for print and handwriting: layout, line, text, table and formula recognizers plus post-processing as datatrove pipelines"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Sebastian Majstorovic", email = "storytracer@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "docling-core>=2.95",
    # tabulate (docling's text export of tables) measures cell widths with wcwidth when it is installed and
    # with len() otherwise: combining marks (kraken writes a + U+0308) then pad tables differently
    "wcwidth>=0.2",
    # Unicode line, word and sentence breaking for recomposition (pure Python)
    "uniseg>=0.10",
    # Unicode scripts (\p{Script=...}) for the rule-based steps' by-script dispatch (linecaster.engines.scripts)
    "regex>=2024.11.6",
    # XML: ALTO, PAGE-XML, hOCR, METS/MODS manifests (linecaster.formats)
    "lxml>=5",
    "numpy>=2",
    "Pillow>=11",
    # http(s):// images, manifests and OCR files (linecaster.net.http): httpx with HTTP/2 (h2)
    "httpx[http2]>=0.28",
    # --random-user-agent (linecaster.net.http.HTTPConfig.use_fake_user_agent): pure Python, no dependencies; every
    # pipeline script offers the option, so it is no extra
    "fake-useragent>=2.2",
    # s3:// paths (OUT, inputs, a broker on S3) through datatrove's s3 extra (s3fs)
    "datatrove[io,s3]>=0.10.1,<0.11",
    "saturate==0.3.0",
    # every YAML file (the catalog, run records): YAML 1.2, duplicate keys are errors, comments kept on write
    # (linecaster.catalog.yamlio)
    "ruamel.yaml>=0.18",
    # tracing, always on (linecaster.tracing): spans per task and per sampled or failed page, written to OUT/traces
    # as OTLP JSON lines and, when the OTEL_* variables say so, exported over OTLP/HTTP
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
]

[project.optional-dependencies]
# MiniCPM-OCR 1.0: the SDK's own post-processing and Markdown assembly (pure Python; no Paddle without its [layout] extra)
minicpm-ocr = ["minicpm-ocr==1.0.1"]
# Ray clusters: datatrove's RayPipelineExecutor (linecaster.runtime.ray.RayGPUExecutor)
ray = ["ray[default]>=2.40"]
# NVIDIA GPUs decode JPEG, JPEG 2000 and TIFF and encode JPEG and JPEG 2000 (linecaster.images.accel): nvImageCodec's
# CUDA 13 wheels (aarch64, x86_64) with nvJPEG, nvJPEG2000 and nvTIFF
nvimgcodec = ["nvidia-nvimgcodec-cu13[nvjpeg,nvjpeg2k,nvtiff]>=0.10,<0.11"]
# PDF files as items, their pages rendered to images (linecaster.blocks.readers.pdf.PdfReader): PDFium's bindings
pypdfium2 = ["pypdfium2>=4.30"]
# scoring against ground truths (linecaster.scoring): the codepoint alignment's edit operations
rapidfuzz = ["rapidfuzz>=3.9"]

[project.scripts]
linecaster = "linecaster.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3.6"]
# the docs site (mkdocs.yml, read by Zensical): uv run --group docs zensical build --strict. Zensical is 0.x (exact pin);
# mike is Zensical's fork of it, which builds with Zensical (versioned docs on gh-pages)
docs = ["zensical==0.1.1", "mike"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# every machine shares one uv.lock; an older uv may not read a lockfile written by a newer one
required-version = ">=0.13.6"

[tool.uv.sources]
# Zensical's fork of mike, at its release for Zensical 0.1
mike = { git = "https://github.com/squidfunk/mike.git", tag = "2.2.0+zensical-0.1.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# the markers (linecaster.testing.markers): gpu and network tests are skipped where they cannot run (the conftest
# hook); CI runs -m "not gpu and not network" -n auto. Serial by default, so a single test, -s and
# --pdb behave as usual; -n auto (pytest-xdist) runs the suite on every core
addopts = ["--strict-markers"]
markers = [
    "gpu: needs a CUDA device; skipped without one",
    "network: downloads model weights or reaches the internet; skipped without the network",
    "slow: takes over about 10 s",
]

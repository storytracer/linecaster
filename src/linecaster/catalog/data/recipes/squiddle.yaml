# yaml-language-server: $schema=../../schemas/recipe.json
schema: linecaster.recipe
id: squiddle
pipeline: transcribe_modular.v1
presets:
  layout: pp-doclayoutv3
  lines: pp-ocrv6-medium-det
  recognition: kraken-ppocrv6-medium
  tables: slanet-plus
  formulas: pp-formulanet-plus-l
  hierarchy: ratios
  paragraphs: unicode-paragraphs
  document: linked-document
options:
  # the item texts (--item-texts): as read, and normalized by the recipe's choice of rules (squiddleocr's
  # division-mark rule among them: a recipe's opinion, never a default)
  text:
  - literal:txt
  - latin-historic+unicode-marks+flow:md
provenance:
  authored_by:
  - Sebastian Majstorovic
  created: 2026-11-03
support: core

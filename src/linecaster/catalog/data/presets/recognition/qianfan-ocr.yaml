# yaml-language-server: $schema=../../../schemas/preset-1.json
schema: linecaster.preset/1
id: qianfan-ocr
edition: 1
step: recognition
model:
  id: qianfan-ocr
  revision: 623bf5d20d446abdb36606aa4547cd0c18886fe5
engine: chat.v1
options:
  adapter: qianfan-ocr
settings:
  sampling:
    temperature: 0.0
    top_p: 1.0
    max_tokens: 8192
  prompt: Parse this document to Markdown.
  chat_template_kwargs:
    enable_thinking: false
serve:
  server: vllm
  version: 0.26.0
  image: vllm/vllm-openai:v0.26.0
  flags:
  - --max-model-len
  - '16384'
  - --limit-mm-per-prompt
  - '{"image": 1}'
  - --mm-processor-cache-gb
  - '0'
  - --no-enable-prefix-caching
capabilities:
  unit: page
  produces:
  - markdown
provenance:
  derived_from:
  - baidu/Qianfan-OCR@623bf5d20d446abdb36606aa4547cd0c18886fe5:README.md
  created: 2026-11-03
support: core

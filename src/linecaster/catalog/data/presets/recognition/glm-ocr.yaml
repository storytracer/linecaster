# yaml-language-server: $schema=../../../schemas/preset-1.json
schema: linecaster.preset/1
id: glm-ocr
edition: 1
step: recognition
model:
  id: glm-ocr
  revision: ca5d8b3e287e52589e37c28385d9655ee4372f9d
engine: chat.v1
options:
  adapter: glm-ocr
settings:
  sampling:
    temperature: 0.01
    top_p: 1.0e-05
    repetition_penalty: 1.1
    max_tokens: 8192
  prompt: 'Text Recognition:'
  image:
    max_pixels: 9633792
serve:
  server: vllm
  version: 0.26.0
  image: vllm/vllm-openai:v0.26.0
  flags:
  - --max-model-len
  - '32768'
  - --no-enable-prefix-caching
  - --mm-processor-cache-gb
  - '0'
  - --limit-mm-per-prompt
  - '{"image": 1}'
capabilities:
  unit: page
  produces:
  - text
provenance:
  derived_from:
  - finebooks/bhl-ocr-eval@76bc19d40c8fcaed7e3d99dd50fdb93603dfac6c:drivers/glm-ocr-port.py
  - uv-scripts/ocr@4ae561fcfef053f60c310cd04f7a7fa0e2fadce2:glm-ocr.py
  - zai-org/GLM-OCR@ca5d8b3e287e52589e37c28385d9655ee4372f9d:README.md
  created: 2026-11-03
support: core

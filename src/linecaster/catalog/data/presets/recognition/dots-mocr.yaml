# yaml-language-server: $schema=../../../schemas/preset-1.json
schema: linecaster.preset/1
id: dots-mocr
edition: 1
step: recognition
model:
  id: dots-mocr
  revision: e539fbb52280393adc081b289ec597430a0f9031
engine: chat.v1
options:
  adapter: dots
settings:
  sampling:
    max_tokens: 16384
    temperature: 0.1
    top_p: 0.9
  prompt: Extract the text content from this image.
  image_placeholder: <|img|><|imgpad|><|endofimg|>
serve:
  server: vllm
  version: 0.26.0
  image: vllm/vllm-openai:v0.26.0
  flags:
  - --max-model-len
  - '32768'
  - --trust-remote-code
  - --chat-template-content-format
  - string
  - --no-enable-prefix-caching
  - --mm-processor-cache-gb
  - '0'
  - --limit-mm-per-prompt
  - '{"image": 1}'
capabilities:
  unit: page
  produces:
  - text
provenance:
  derived_from:
  - uv-scripts/ocr@4ae561fcfef053f60c310cd04f7a7fa0e2fadce2:dots-mocr.py
  - rednote-hilab/dots.mocr@e539fbb52280393adc081b289ec597430a0f9031:README.md
  created: 2026-11-03
support: experimental

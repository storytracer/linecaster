# yaml-language-server: $schema=../../../schemas/preset-1.json
schema: linecaster.preset/1
id: unlimited-ocr
edition: 1
step: recognition
model:
  id: unlimited-ocr
  revision: 07dea832e22aefee32ad281d4b80551282e1c168
engine: chat.v1
options:
  adapter: unlimited-ocr
settings:
  sampling:
    temperature: 0.0
    max_tokens: 8192
    skip_special_tokens: false
  prompt: document parsing.
  vllm_xargs:
    ngram_size: 35
    window_size: 128
  logits_processor: vllm.model_executor.models.unlimited_ocr:NGramPerReqLogitsProcessor
serve:
  server: vllm
  version: 0.26.0
  image: vllm/vllm-openai:v0.26.0
  flags:
  - --max-model-len
  - '32768'
  - --trust-remote-code
  - --no-enable-prefix-caching
  - --mm-processor-cache-gb
  - '0'
  - --limit-mm-per-prompt
  - '{"image": 1}'
capabilities:
  unit: page
  produces:
  - markdown
provenance:
  derived_from:
  - uv-scripts/ocr@4ae561fcfef053f60c310cd04f7a7fa0e2fadce2:unlimited-ocr-vllm.py
  - baidu/Unlimited-OCR@07dea832e22aefee32ad281d4b80551282e1c168:README.md
  created: 2026-11-03
support: core

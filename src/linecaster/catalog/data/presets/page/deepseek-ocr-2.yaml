# yaml-language-server: $schema=../../../schemas/preset-1.json
schema: linecaster.preset/1
id: deepseek-ocr-2
edition: 1
step: page
model:
  id: deepseek-ocr-2
  revision: aaa02f3811945a91062062994c5c4a3f4c0af2b0
engine: chat.v1
options:
  adapter: deepseek-ocr
settings:
  sampling:
    temperature: 0.0
    max_tokens: 4096
    skip_special_tokens: false
  prompt: <|grounding|>Convert the document to markdown.
  vllm_xargs:
    ngram_size: 30
    window_size: 90
    whitelist_token_ids:
    - 128821
    - 128822
  logits_processor: vllm.model_executor.models.deepseek_ocr:NGramPerReqLogitsProcessor
serve:
  server: vllm
  version: 0.26.0
  image: vllm/vllm-openai:v0.26.0
  flags:
  - --max-model-len
  - '8192'
  - --trust-remote-code
  - --no-enable-prefix-caching
  - --mm-processor-cache-gb
  - '0'
  - --limit-mm-per-prompt
  - '{"image": 1}'
capabilities:
  unit: page
  produces:
  - markdown
provenance:
  derived_from:
  - finebooks/bhl-ocr-eval@76bc19d40c8fcaed7e3d99dd50fdb93603dfac6c:drivers/deepseek-ocr2-port.py
  - uv-scripts/ocr@4ae561fcfef053f60c310cd04f7a7fa0e2fadce2:deepseek-ocr2-vllm.py
  - deepseek-ai/DeepSeek-OCR-2@aaa02f3811945a91062062994c5c4a3f4c0af2b0:README.md
  created: 2026-11-03
support: core

notes: "NOTES.md, \"dots.mocr and LightOnOCR-3 on an RTX 4000 SFF Ada\". vLLM 0.30.0 (the board's version for this row) from PyPI in its own uv venv (resolved as of the release, 2026-09-23), not the board's image. No memory change: the board's flags fit (11.98 GiB KV cache). Scored the board's way (consolidate, normalize_outputs postproc 3, score_dataset; bhl-ocr-eval at 76bc19d). The board's raw completions for the same 60 pages, normalized the same way: 0.0633 / 0.0393 / 0.9521 (its published normalized.parquet gives the same). Most of the difference is one Conchologia text page (8967173) where the board's completion moves one species' block (synonymy and description) to the end of the page (page CER 0.230 against 0.018 here): without it 0.0312 / 0.0312 reading. 28 of 60 completions byte-identical; prompt tokens equal on all 60 (172,552); no loops, longest completion 1,323 of 4,096 tokens."

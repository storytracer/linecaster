notes: "NOTES.md, \"olmOCR-2-7B-1025-FP8 on native FP8\". vLLM 0.26.0 from PyPI in its own uv venv (resolved as of the release, 2026-07-26), not the board's image; the FP8 layers ran on CutlassFP8ScaledMMLinearKernel (W8A8), where the board's A10G (Ampere) dequantizes. No memory change: the board's flags fit (5.72 GiB KV cache). Scored the board's way: consolidate, normalize_outputs postproc 3, score_dataset (bhl-ocr-eval at 76bc19d, a fresh clone). The board's raw completions for the same 60 pages, re-normalized the same way: 0.0345 / 0.0196 / 0.9436 (its published normalized.parquet predates the front-matter fix: 0.0461 / 0.0304). 34 of 60 completions byte-identical to the board's; linecaster's image encoding gives the driver's PNG bytes on all 60 pages (same Pillow) and the prompt tokens equal the board's (96,718 in all); no page reached its token cap."

# yaml-language-server: $schema=../../schemas/normalization.json
schema: linecaster.normalization
id: quotes
description: Single quotes, apostrophes, the backtick and the acute accent as ', curly double quotes as ".
scripts:
- '*'
languages: []
use:
- output
- comparison
subsumes: []
rule:
  map:
    ’: "'"
    ‘: "'"
    ʼ: "'"
    '`': "'"
    ´: "'"
    “: '"'
    ”: '"'

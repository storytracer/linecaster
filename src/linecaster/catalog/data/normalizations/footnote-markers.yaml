# yaml-language-server: $schema=../../schemas/normalization.json
schema: linecaster.normalization
id: footnote-markers
description: 'Footnote markers in brackets as their label after a space, for comparison: [1] (one to three digits) and the Markdown footnote [^1] or [^a] (one to three letters or digits) as " 1", " a", so that "12.3%[1]" does not read as "12.3%1" and a marker written as a reference matches one written as text. Spaces inside the brackets are allowed; other brackets ([12a], [1, 2], [1234]) and a marker without brackets stay. Adopted from Omni Parse Bench''s comparison fold (omni_parse_bench.normalize, Apache-2.0).'
scripts:
- '*'
languages: []
use:
- comparison
subsumes: []
rule:
  patterns:
  - match: \[\^\s*(\w{1,3})\s*\]|\[\s*(\d{1,3})\s*\]
    flags: []
    replace: ' \1\2'

# yaml-language-server: $schema=../../schemas/normalization.json
schema: linecaster.normalization
id: divided-words
description: "A word divided across lines or pages written whole where the source marks it (joined edits: Wikisource's hws/hwe, ALTO's SUBS_CONTENT): the first part left out, the whole word where the second stands, a compound's own hyphen kept."
scripts:
- '*'
languages: []
use:
- output
subsumes: []
rule:
  divided_words: source

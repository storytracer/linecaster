# yaml-language-server: $schema=../../schemas/normalization.json
schema: linecaster.normalization
id: greek-monotonic
description: "Polytonic Greek letters as monotonic (the 1982 convention): the breathings (psili U+0313, dasia U+0314) and the iota subscript and adscript (ypogegrammeni and prosgegrammeni, U+0345) dropped, the oxia, varia and perispomeni (U+0301, U+0300, U+0342) as the tonos; the diaeresis (dialytika) stays, ῒ and ῗ as ΐ. A table of the composed letters of Greek Extended (U+1F00 to U+1FFC), so it applies to composed text (after nfc). Character by character: the accents monotonic drops on monosyllables (τὸν as τόν, not τον) and an enclitic's second accent stay as the tonos."
scripts:
- Grek
languages: []
use:
- output
- comparison
subsumes: []

# yaml-language-server: $schema=../../schemas/normalization.json
schema: linecaster.normalization
id: hebrew-points
description: "Hebrew points and cantillation removed: the accents U+0591 to U+05AF, the points (niqqud) U+05B0 to U+05BD, rafe U+05BF, shin and sin dot U+05C1, U+05C2, the upper and lower dot U+05C4, U+05C5, qamats qatan U+05C7 and the Judeo-Spanish varika U+FB1E; the pointed presentation forms U+FB1D to U+FB4E as their bare letters. The maqaf (U+05BE), paseq (U+05C0), sof pasuq (U+05C3), nun hafukha (U+05C6) and the letters stay. For comparison only: without its points a pointed text is not the unpointed spelling (which adds vowel letters), and in Yiddish the points are part of the spelling."
scripts:
- Hebr
languages: []
use:
- comparison
subsumes: []

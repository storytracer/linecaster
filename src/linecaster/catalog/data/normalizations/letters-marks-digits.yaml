# yaml-language-server: $schema=../../schemas/normalization.json
schema: linecaster.normalization
id: letters-marks-digits
description: Only letters, combining marks and digits of any script (Unicode categories L, M, N) and U+FFFD (an illegible character); every run of anything else one space.
scripts:
- '*'
languages: []
use:
- comparison
subsumes: []
rule:
  keep:
    categories:
    - L
    - M
    - N
    ranges: []
    also: �

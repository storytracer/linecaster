# yaml-language-server: $schema=../../schemas/normalization.json
schema: linecaster.normalization
id: arabic-marks
description: "The Arabic script's vowel and other combining marks removed: the honorific signs and small high letters U+0610 to U+061A, the harakat, tanwin, shadda and sukun U+064B to U+0652, the further vowel signs and marks U+0656 to U+065E, the superscript (dagger) alef U+0670, and the Quranic annotation marks U+06D6 to U+06DC, U+06DF to U+06E4, U+06E7, U+06E8, U+06EA to U+06ED. The madda and hamza above and below (U+0653 to U+0655) and the wavy hamza below (U+065F) stay, as do the small waw and yeh (U+06E5, U+06E6, letters) and the end of ayah, rub el hizb and sajdah signs: they belong to the letters or the text. For comparison only: a reading text keeps its vocalization."
scripts:
- Arab
languages: []
use:
- comparison
subsumes: []
rule:
  map:
    "\u0610": ''  # ARABIC SIGN SALLALLAHOU ALAYHE WASSALLAM
    "\u0611": ''  # ARABIC SIGN ALAYHE ASSALLAM
    "\u0612": ''  # ARABIC SIGN RAHMATULLAH ALAYHE
    "\u0613": ''  # ARABIC SIGN RADI ALLAHOU ANHU
    "\u0614": ''  # ARABIC SIGN TAKHALLUS
    "\u0615": ''  # ARABIC SMALL HIGH TAH
    "\u0616": ''  # ARABIC SMALL HIGH LIGATURE ALEF WITH LAM WITH YEH
    "\u0617": ''  # ARABIC SMALL HIGH ZAIN
    "\u0618": ''  # ARABIC SMALL FATHA
    "\u0619": ''  # ARABIC SMALL DAMMA
    "\u061A": ''  # ARABIC SMALL KASRA
    "\u064B": ''  # ARABIC FATHATAN
    "\u064C": ''  # ARABIC DAMMATAN
    "\u064D": ''  # ARABIC KASRATAN
    "\u064E": ''  # ARABIC FATHA
    "\u064F": ''  # ARABIC DAMMA

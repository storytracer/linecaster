# yaml-language-server: $schema=../../../schemas/conventions.json
schema: linecaster.conventions
id: enwikisource
format: html
extends: mediawiki
description: >-
  English Wikisource's templates, as the classes and attributes their output carries: running heads, the end of a
  page's paragraph, corrections and tooltips, sidenotes, ditto marks, dot leaders, figures, editors' errata,
  stanzas across a page break and words divided across a page break.
source:
  wiki: English Wikisource (en.wikisource.org)
  dump: enwikisource-20261101-pages-articles (Template, Module and Index namespaces)
  importer: import.mediawiki.v1 (linecaster-mediawiki 0.1.1, wikitextprocessor 6f96ddf)
# what the transcription already is (Wikisource:Style guide/Orthography; Help:Beginner's guide to typography): the
# long s as s, typographic ligatures as their letters (æ and œ kept), r rotunda modernized, a word broken over two
# lines rejoined (a true hyphen kept); MediaWiki's NFC
transcription:
- nfc
- long-s
- ligatures
- r-rotunda
- divided-words
rules:
- id: running-head-cells
  match: {kind: tree, css: .wst-rh-cell}
  decision: cell
  why: >-
    {{RunningHeader}} ({{rh}}, {{rvh}} and their variants) prints the running head's left, centre and right as one
    line: its cells are one region of the page's furniture, each cell a region of its own.
  decided: 2026-11-13
- id: no-run-on
  match: {kind: tree, css: .wst-nop}
  decision: break
  why: >-
    {{nop}} ends the paragraph: at the end of a page it says that the page's last paragraph does not run on onto the
    next page.
  decided: 2026-11-13
- id: corrections
  match: {kind: tree, css: ".wst-tooltip[title^='[sic]']"}
  decision: edit
  params: {kind: corrected, attr: title, extract: "^\\[sic\\]\\s*'(.*)'$"}
  why: >-
    {{SIC}} shows the text as printed and the editors' correction in its tooltip ("[sic] 'the'"): the printed text
    is the page's, the correction an edit of it.
  decided: 2026-11-13
- id: tooltips
  match: {kind: tree, css: .wst-tooltip}
  decision: describe
  params: {kind: note, attr: title}
  why: "{{tooltip}} shows a note of the editors when the pointer rests on the text; the note is not printed."
  decided: 2026-11-13
- id: sidenotes
  match: {kind: tree, css: .wst-sidenote}
  decision: note
  params: {role: marginalia}
  why: >-
    {{left sidenote}} and {{right sidenote}} print a note in the margin beside the paragraph where they stand: a
    region of its own (marginalia), not part of the paragraph's text.
  decided: 2026-11-13
- id: ditto-hidden
  match: {kind: tree, css: .__ditto_hidden}
  decision: invisible
  why: >-
    {{ditto}} prints a ditto mark where a word is repeated; the word itself is kept, invisible, to give the mark its
    width.
  decided: 2026-11-12
- id: dot-leaders
  match: {kind: tree, css: .ws-noexport}
  decision: remove
  params: {reason: generated}
  by: rule
  why: >-
    Elements of class ws-noexport (dot leaders of tables of contents, navigation) are drawn by the templates and
    left out of exports by WS Export; the page prints leaders, not text.
  decided: 2026-11-12
  open: A list of illustrations may set its credits inside the leader element; their letters are lost with it.
- id: figure-captions
  match: {kind: tree, css: .wst-freedimg-caption}
  decision: caption
  why: "{{FreedImg}} prints a figure's caption under or over it."
  decided: 2026-11-14
- id: figure-boxes
  match: {kind: tree, css: span.wst-freedimg}
  decision: block
  params: {role: picture}
  why: "{{FreedImg/span}} sets a figure in spans; its box is a block of its own, as the figure is on the page."
  decided: 2026-11-14
- id: errata-notes
  match: {kind: tree, css: "aside[data-group=errata]"}
  decision: remove
  params: {reason: editorial, keep_text: true}
  why: >-
    {{Errata}} shows the printed text and adds the editors' correction as a note of the group errata; the note is
    the editors', not the page's.
  decided: 2026-11-14
- id: stanza-continued
  match: {kind: tree, css: "[data-mw-template=Ppoem][data-mw-param-start=follow]"}
  decision: continues
  why: >-
    {{ppoem|start=follow}}: the page's first stanza continues the previous page's last; the module writes a complete
    poem on the Page: page, so only the call says it (the reader's data-mw-template and data-mw-param-start).
  decided: 2026-11-15
- id: stanza-runs-on
  match: {kind: tree, css: .ws-poem-stanza, inside: "[data-mw-template=Ppoem][data-mw-param-end=follow]"}
  decision: runs_on
  why: >-
    {{ppoem|end=follow}}: the page's last stanza runs on into the next page's first. Matched on the poem's stanzas,
    since a call with start=follow too has its poem's element decided by stanza-continued.
  decided: 2026-11-15
- id: divided-words
  match:
    kind: tree
    css: >-
      span[data-mw-template=Hws], span[data-mw-template=Hwe], span[data-mw-template='Hyphenated word start'],
      span[data-mw-template='Hyphenated word end']
  decision: edit
  params: {kind: joined, attr: title}
  why: >-
    {{hws}} and {{hwe}} write each half of a word divided across a page break as printed, the whole word in the
    span's title ("de-", "pends": "depends"); in the main namespace the wiki prints the whole word in its place. Each
    half is the page's text, the whole word a joined edit of it; an item joins the two (linecaster-mediawiki's
    link_pages). Matched by the call (the reader's data-mw-template), since the span has no class of its own.
  decided: 2026-11-15

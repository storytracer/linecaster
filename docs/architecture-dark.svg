<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 336" width="960" height="336" role="img" aria-label="A linecaster pipeline is one datatrove task: reader, layout, lines, recognition, tables, typography, document and writer blocks pass one Transcription along. The model blocks reach their models on a GPU server through saturate; vision-language blocks reach vLLM the same way. The executor runs many copies of the task.">

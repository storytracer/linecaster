# linecaster's docs workflow: the generated pages are written (linecaster docs), then the site is built and published
# with mike on the gh-pages branch, which GitHub Pages serves. A release tag (v<major>.<minor>.<patch>) publishes
# version <major>.<minor> and moves "latest" to it. Only releases are published: main is read in a checkout
# (`linecaster docs`, then `mkdocs serve`). No secrets.
name: Docs

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # setup-uv publishes no major tags since v8: an exact release
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # the project's [tool.uv] required-version
          version: "0.13.6"
          python-version: "3.12"
          # uv's cache (the wheels it downloaded and built), kept until uv.lock changes
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: git fetch origin gh-pages --depth=1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # the generated pages (not in git), with every extra as in CI: the extras' blocks have pages too
      - name: Generate the docs
        run: uv run --locked --all-extras linecaster docs
      - name: Publish the release's version
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version%.*}"
          uv run --only-group docs mike deploy --push --update-aliases "$version" latest
          uv run --only-group docs mike set-default --push latest

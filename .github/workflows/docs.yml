# linecaster's docs workflow: the site is built and published with mike on the gh-pages branch, which GitHub Pages
# serves. A release tag (v<major>.<minor>.<patch>) publishes version <major>.<minor> and moves "latest" to it; a push
# to main publishes version "dev". No secrets.
name: Docs

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # setup-uv publishes no major tags since v8: an exact release
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # the project's [tool.uv] required-version
          version: "0.13.6"
          python-version: "3.12"
          # uv's cache (the wheels it downloaded and built), kept until uv.lock changes
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: git fetch origin gh-pages --depth=1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish a release's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version%.*}"
          uv run --only-group docs mike deploy --push --update-aliases "$version" latest
          uv run --only-group docs mike set-default --push latest
      - name: Publish main as dev
        if: github.ref == 'refs/heads/main'
        run: uv run --only-group docs mike deploy --push dev

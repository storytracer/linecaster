# linecaster's CI workflow: the core's tests and checks on a CPU, without the engines' environments (torch is too
# large; the engines' conformance runs locally, engines/<engine>/README.md). No secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no major tags since v8: an exact release
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # the project's [tool.uv] required-version
          version: "0.13.6"
          python-version: "3.12"
          # uv's cache (the wheels it downloaded and built), kept until uv.lock changes
          enable-cache: true
          cache-dependency-glob: uv.lock
      # every extra: the readers and adapters they serve are tested and documented (MiniCPM-OCR, PDFium, Ray)
      - run: uv sync --locked --all-extras
      - run: uv run pytest -n auto -m "not gpu and not network"
      - run: uv run linecaster catalog verify
      # the generated pages are not in git: written here, so a broken reference in them fails the strict build
      - run: uv run linecaster docs
      - run: uv run --group docs mkdocs build --strict
